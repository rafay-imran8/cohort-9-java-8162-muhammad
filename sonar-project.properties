# Root project metadata
sonar.organization=rafay
sonar.projectKey=com.rafay:cohort-9-java-8162-muhammad
sonar.projectName=cohort-9-java-8162-muhammad
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Build and source layout
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=21
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx

# Test/coverage reporting
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Exclude generated and dependency outputs
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/coverage/**,**/.idea/**,**/.git/**,**/frontend/public/**

# Coverage exclusions for generated/configuration/data files
sonar.coverage.exclusions=backend/src/main/java/**/config/**,backend/src/main/java/**/dto/**,backend/src/main/java/**/entity/**,backend/src/main/java/**/exception/**,backend/src/main/java/com/rafay/backend/BackendApplication.java

# Sonar Way profiles
sonar.profile.java=Sonar way
sonar.profile.js=Sonar way
